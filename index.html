<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ナラベル — ログイン</title>
  <!-- A-3: CSP（unsafe-inline を除去し、外部ファイルのみ許可） -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' https://www.gstatic.com;
    style-src  'self' https://fonts.googleapis.com;
    font-src   https://fonts.gstatic.com;
    connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com;
    img-src    'self' data: blob:;
    frame-src  'none';
    object-src 'none';
  ">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-icon">🖼️</div>
      <h1>ナラベル</h1>
    </div>
    <div class="sub">メールアドレスとパスワードでログイン</div>

    <form id="loginForm" autocomplete="on">
      <div class="field">
        <span class="icon">📧</span>
        <input id="email" class="input" type="email" inputmode="email"
               autocomplete="email" placeholder=" " required>
        <label class="label" for="email">メールアドレス</label>
      </div>
      <div class="field">
        <span class="icon">🔒</span>
        <input id="password" class="input" type="password"
               autocomplete="current-password" placeholder=" " required>
        <label class="label" for="password">パスワード</label>
      </div>

      <!-- A-2: メールアドレスのみ記憶（パスワードは保存しない） -->
      <div class="checkbox-row">
        <input type="checkbox" id="rememberEmail">
        <label for="rememberEmail">メールアドレスを記憶する</label>
      </div>

      <div class="btn-row">
        <button type="submit" class="btn">ログイン</button>
        <button id="changePwBtn" type="button" class="btn secondary">パスワード変更</button>
      </div>
      <button id="resetBtn" type="button" class="btn secondary btn-full">
        パスワードを忘れた
      </button>

      <div class="divider"></div>
      <div id="message" class="msg"></div>
    </form>
  </div>

  <!-- パスワード変更モーダル -->
  <div id="changePwModal" class="modal-overlay"
       role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal">
      <p class="modal-title" id="modalTitle">🔑 パスワード変更</p>

      <div class="modal-field">
        <label class="modal-label" for="modalCurrentPw">現在のパスワード</label>
        <input id="modalCurrentPw" class="modal-input" type="password"
               autocomplete="current-password" placeholder="現在のパスワード" />
      </div>

      <div class="modal-field">
        <label class="modal-label" for="modalNewPw">新しいパスワード（8文字以上）</label>
        <input id="modalNewPw" class="modal-input" type="password"
               autocomplete="new-password" placeholder="新しいパスワード" />
      </div>

      <div class="modal-field">
        <label class="modal-label" for="modalNewPw2">新しいパスワード（確認）</label>
        <input id="modalNewPw2" class="modal-input" type="password"
               autocomplete="new-password" placeholder="もう一度入力" />
      </div>

      <div id="modalMsg" class="modal-msg" role="alert" aria-live="polite"></div>

      <div class="modal-btn-row">
        <button id="modalSubmitBtn" type="button" class="btn">変更する</button>
        <button id="modalCancelBtn" type="button" class="btn secondary">キャンセル</button>
      </div>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="index.js"></script>

  <div class="page-footer">
    <a href="privacy.html">プライバシーポリシー</a>
    <a href="terms.html">利用規約</a>
  </div>

</body>
</html>
