<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ナラベル</title>
  <!-- A-3: CSP（unsafe-inline を除去し、外部ファイルのみ許可） -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' https://www.gstatic.com https://cdnjs.cloudflare.com;
    style-src  'self' https://fonts.googleapis.com;
    font-src   https://fonts.gstatic.com;
    connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com;
    img-src    'self' data: blob:;
    frame-src  'none';
    object-src 'none';
  ">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="tool.css">

  <!-- Firebase compat -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>

  <!-- Firebase認証ガード（画面表示前に確認） -->
  <script src="tool-guard.js"></script>
</head>

<body>
  <!-- 多重ログイン警告モーダル -->
  <div id="mlOverlay" class="ml-overlay" role="dialog" aria-modal="true" aria-labelledby="mlTitle">
    <div class="ml-card">
      <div class="ml-icon">⚠️</div>
      <div id="mlTitle" class="ml-title">セッションが残っています</div>
      <p class="ml-body">別の端末・ブラウザのセッションが残っています。<br>ブラウザを閉じただけでログアウトしていない場合もこの画面が出ます。<br><br>「全セッションを解除してログイン」を押すと、すべての端末のセッションをリセットしてこの端末でログインできます。</p>
      <div class="ml-actions">
        <button id="mlBtnForce" class="ml-btn-force">🔄 全セッションを解除してログイン</button>
        <button id="mlBtnLogout" class="ml-btn-logout">ログアウトして戻る</button>
      </div>
    </div>
  </div>

  <!-- ヘッダー -->
  <header class="header">
    <div class="header-logo">
      <div class="logo-icon">🖼️</div>
      ナラベル
    </div>
    <div class="header-spacer"></div>
    <a href="マニュアル.html" target="_blank" class="btn ghost">📖 使い方</a>
    <div class="user-badge">
      <div class="user-avatar">👤</div>
      <span id="userEmail" class="user-email"></span>
    </div>
    <button id="logoutBtn" class="btn ghost">🚪 ログアウト</button>
  </header>

  <!-- ツールバー -->
  <div class="toolbar">
    <input type="file" id="fileInput" class="file-input" multiple accept="image/*">
    <label for="fileInput" class="btn primary">＋ 画像を追加</label>

    <div class="sep"></div>

    <!-- D-1: Undo/Redo ボタン -->
    <button id="undoBtn" class="btn" disabled title="元に戻す (Ctrl+Z)">↩ 元に戻す</button>
    <button id="redoBtn" class="btn" disabled title="やり直す (Ctrl+Y)">↪ やり直す</button>

    <div class="sep"></div>

    <div class="slider-group">
      <span>🖼</span>
      <input type="range" id="sizeSlider" class="slider" min="120" max="640" value="200">
      <span id="sizeVal" class="slider-val">200px</span>
    </div>

    <div class="sep"></div>

    <button id="saveBtn"   class="btn ok-btn" disabled>💾 保存 (ZIP)</button>
    <button id="deleteBtn" class="btn danger"  disabled>🗑 削除</button>
    <button id="resetBtn"  class="btn"         disabled>🔄 全リセット</button>
  </div>

  <!-- ステータスバー -->
  <div class="statusbar">
    <span id="fileBadge"></span>
    <span id="selBadge"></span>
    <span id="batchBadge"></span>
    <div class="progress-wrap" id="progressWrap">
      <div class="prog-track"><div class="prog-fill" id="progFill"></div></div>
      <div class="prog-text"  id="progText"></div>
    </div>
    <span class="kb-hint" id="kbHint">
      Ctrl+クリックで複数選択 · Shift+クリックで範囲選択 · Delete で削除 · Ctrl+Z で元に戻す
    </span>
  </div>

  <!-- メインエリア -->
  <main class="main" id="mainArea">
    <!-- B-3: 空き状態のドロップゾーン -->
    <div class="drop-zone visible" id="dropZone">
      <div class="dz-icon">🖼️</div>
      <div class="dz-title">画像をここにドロップ</div>
      <div class="dz-sub">
        JPG・PNG・GIF・WEBP・HEIC など複数ファイルに対応<br>
        ドラッグ&ドロップまたはボタンでファイルを選択
      </div>
      <label for="fileInput" class="dz-btn">📁 ファイルを選択して追加</label>
    </div>

    <!-- ギャラリー -->
    <div class="gallery-wrap" id="galleryWrap">
      <div class="gallery-grid" id="galleryGrid"></div>
    </div>
  </main>

  <!-- トースト -->
  <div class="toast-box" id="toastBox"></div>

  <!-- JSZip -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="tool-app.js"></script>
</body>
</html>
